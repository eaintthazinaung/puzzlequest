<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Choose Your Guardian — PuzzleQuest</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav id="main-nav"></nav>
<main>
  <div class="guardian-page">

    <div class="guardian-header">
      <span class="section__label">✨ The Lost Atelier</span>
      <h1>Choose Your Guardian</h1>
      <p style="color:var(--tx2);max-width:520px;margin:0 auto;font-size:1.05rem;">
        Look into the silver mirrors. Three guardian spirits await to bond with your soul —
        your choice will set the color of your entire journey through Aetheria.
      </p>
    </div>

    <div class="guardian-grid" id="guardian-grid">
      <!-- Built by JS -->
    </div>

    <div class="guardian-footer">
      <button class="btn btn--primary btn--lg" id="guardian-confirm" disabled>
        🌟 Bond with Guardian →
      </button>
      <p style="margin-top:12px;font-size:.82rem;color:var(--tx3);">
        You can change your Guardian later from your Profile page.
      </p>
    </div>

  </div>
</main>
<footer id="main-footer"></footer>
<script src="js/main.js"></script>
</body>
</html>
